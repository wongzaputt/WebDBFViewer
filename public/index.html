<!doctype html>
<html lang="th">

  <head>
    <meta charset="UTF-8" />
    <title>WebDBFViewer - DataRecon</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="/css/dbf-viewer.css" />
  </head>

  <body>
    <h2>WebDBFViewer</h2>

    <div class="controls">
      <input type="text" id="fileNameDisplay" placeholder="ไม่ได้เลือกไฟล์" readonly />
      <button id="btnBrowse">Browse</button>
      <button id="btnStructure" disabled>Structure</button>
      <input type="file" id="fileInput" accept=".dbf" style="display: none" />
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="ใส่คำค้นหา..." style="flex-grow: 1" />
      <button id="btnSearch">ค้นหา</button>
      <button id="btnClearSearch" class="btn-clear">ล้างการค้นหา</button>
      <button id="btnExportPage" class="btn-export">Export Page</button>
      <button id="btnExportAll" class="btn-export-all">Export All</button>
    </div>

    <div class="table-container">
      <table id="dataTable">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination" id="paginationControls"></div>

    <div id="structureModal" class="modal-overlay">
      <div class="modal-content">
        <button id="btnCloseModal" class="btn-close-modal">ปิด</button>
        <div class="modal-header" id="modalTableName">Structure: Unknown</div>
        <table id="structureTable">
          <thead>
            <tr>
              <th>Field Name</th>
              <th>Inferred Type</th>
              <th>Max Length</th>
            </tr>
          </thead>
          <tbody id="structureBody"></tbody>
        </table>
      </div>
    </div>

    <script src="/js/dbf-viewer.js"></script>
  </body>

</html>
