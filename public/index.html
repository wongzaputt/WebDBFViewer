<!DOCTYPE html>
<html lang="th">

    <head>
        <meta charset="UTF-8">
        <title>WebDBFViewer</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    </head>

    <body>

        <h2>WebDBFViewer</h2>

        <div class="controls">
            <input type="text" id="fileNameDisplay" placeholder="ไม่ได้เลือกไฟล์" readonly>
            <button onclick="document.getElementById('fileInput').click()">Browse</button>
            <input type="file" id="fileInput" accept=".dbf" style="display:none" onchange="handleFileSelect(this)">
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="ใส่คำค้นหา (เช่น 'สมชาย กรุงเทพ')..." style="flex-grow: 1;">
            <button onclick="searchData()">ค้นหา</button>
            <button class="btn-clear" onclick="clearSearch()">ล้างการค้นหา</button>
            <button class="btn-export" onclick="exportCurrentPage()">Export Page</button>
            <button class="btn-export-all" onclick="exportAllData()">Export All</button>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="pagination" id="paginationControls"></div>

        <script src="/js/viewer.js"></script>
    </body>

</html>
